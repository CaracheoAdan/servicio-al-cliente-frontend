# Nginx web server configuration for Servicio al Cliente Frontend (React / Vite SPA).
# Listens on port 5175 for LAN / internal access.

server {
    listen 5175;
    listen [::]:5175;
    server_name _;

    root /srv/www/servicio-al-cliente-frontend;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint for monitoring / smoke tests
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Cache immutable Vite build assets aggressively (1 year)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history mode fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache index.html shell so clients receive updates immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Optional: Reverse-proxy API calls to the backend running on port 5041
    # location /api/ {
    #     proxy_pass http://127.0.0.1:5041/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
